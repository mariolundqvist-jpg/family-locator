databases:
  - name: safepath-db
    databaseName: safepath
    user: safepath
    plan: free

services:
  - type: web
    name: safepath-server
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: safepath-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: SAFEPATH_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: support@byggbartech.com
      - key: DEFAULT_EMERGENCY_NUMBER
        value: "112"
      - key: STAGING
        value: "1"
